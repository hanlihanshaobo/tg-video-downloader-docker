<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURAL DOWNLINK // TG Video</title>
<style>
  :root {
    --cyan: #00e5ff;
    --cyan-dim: #0ea5b7;
    --magenta: #ff2d95;
    --amber: #ffc857;
    --bg0: #05070f;
    --bg1: #0a1020;
    --bg2: #101a30;
    --line: rgba(0, 229, 255, 0.18);
    --text: #c9f6ff;
    --text-dim: #6b93a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(0,229,255,0.10), transparent 60%),
      radial-gradient(1000px 500px at 90% 110%, rgba(255,45,149,0.10), transparent 60%),
      var(--bg0);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  /* starfield */
  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 25px 25px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 120px 90px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 200px 160px, rgba(0,229,255,0.8), transparent),
      radial-gradient(1px 1px at 80px 250px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 300px 40px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 360px 300px, rgba(0,229,255,0.5), transparent);
    background-size: 420px 340px;
    animation: drift 90s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0; } to { background-position: -420px -340px; } }
  /* scanline overlay */
  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.35;
    background: repeating-linear-gradient(
      0deg, transparent 0 2px, rgba(0,229,255,0.03) 2px 4px);
  }
  .app {
    position: relative; z-index: 2;
    max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px;
  }
  header { margin-bottom: 24px; }
  .title {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    text-shadow: 0 0 12px rgba(0,229,255,0.6), 0 0 40px rgba(0,229,255,0.3);
  }
  .title h1 {
    margin: 0; font-size: 26px; letter-spacing: 4px; color: var(--cyan);
    font-weight: 600; text-transform: uppercase;
  }
  .title .sub { color: var(--text-dim); font-size: 12px; letter-spacing: 2px; }
  .langbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .langbtn {
    font-family: inherit; font-size: 12px; letter-spacing: 1px;
    padding: 4px 12px; background: transparent; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
    transition: all 0.15s ease;
  }
  .langbtn.active { color: var(--cyan); border-color: var(--cyan); text-shadow: 0 0 8px rgba(0,229,255,0.6); box-shadow: 0 0 8px rgba(0,229,255,0.3); }
  .statusline { margin-top: 10px; font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }
  .statusline .led { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--cyan); margin-right:6px; box-shadow:0 0 8px var(--cyan); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .panel {
    background: linear-gradient(180deg, rgba(16,26,48,0.7), rgba(8,12,24,0.8));
    border: 1px solid var(--line);
    border-radius: 8px;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 24px rgba(0,229,255,0.06), inset 0 0 30px rgba(0,229,255,0.03);
    padding: 16px;
  }

  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    font-family: inherit;
    padding: 9px 18px;
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 12px;
    box-shadow: 0 0 10px rgba(0,229,255,0.2), inset 0 0 8px rgba(0,229,255,0.08);
    transition: all 0.15s ease;
  }
  button:hover:not(:disabled) {
    background: rgba(0,229,255,0.12);
    box-shadow: 0 0 18px rgba(0,229,255,0.5), inset 0 0 12px rgba(0,229,255,0.15);
    text-shadow: 0 0 8px rgba(0,229,255,0.9);
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.danger { color: var(--magenta); border-color: var(--magenta); box-shadow: 0 0 10px rgba(255,45,149,0.2), inset 0 0 8px rgba(255,45,149,0.08); }
  button.danger:hover:not(:disabled) { background: rgba(255,45,149,0.12); box-shadow: 0 0 18px rgba(255,45,149,0.5); text-shadow: 0 0 8px rgba(255,45,149,0.9); }

  .status { display: none; padding: 8px 14px; border-left: 2px solid var(--cyan); font-size: 13px; }
  .status.error { display: block; border-color: var(--magenta); color: #ff9ec6; text-shadow: 0 0 8px rgba(255,45,149,0.4); }
  .status.ok { display: block; color: var(--cyan); text-shadow: 0 0 8px rgba(0,229,255,0.4); }

  #taskStatus {
    display: none; margin-bottom: 14px; padding: 12px 14px;
    border: 1px dashed rgba(255,200,87,0.4);
    color: var(--amber);
    font-size: 13px;
    background: rgba(255,200,87,0.05);
    text-shadow: 0 0 8px rgba(255,200,87,0.3);
    border-radius: 6px;
  }

  details { margin-bottom: 16px; }
  details summary {
    cursor: pointer; color: var(--cyan); letter-spacing: 2px; font-size: 13px;
    text-transform: uppercase; text-shadow: 0 0 8px rgba(0,229,255,0.4);
    list-style: none;
  }
  details summary::before { content: "▸ "; color: var(--cyan); }
  details[open] summary::before { content: "▾ "; }
  details[open] { border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .dlrow { margin-top: 12px; }
  .dlrow label { color: var(--text-dim); font-size: 12px; letter-spacing: 1px; margin-right: 8px; }
  .dlrow input {
    font-family: inherit; padding: 8px 10px; background: rgba(0,0,0,0.4);
    border: 1px solid var(--line); color: var(--text); border-radius: 4px; font-size: 13px;
    outline: none;
  }
  .dlrow input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,0.3); }
  .dlrow button { margin-left: 10px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 12px 14px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--cyan-dim);
    border-bottom: 1px solid var(--line);
    text-shadow: 0 0 6px rgba(0,229,255,0.3);
    position: sticky; top: 0; background: var(--bg1);
  }
  tbody td { padding: 12px 14px; border-bottom: 1px solid rgba(0,229,255,0.07); font-size: 14px; }
  tr.clickable { cursor: pointer; transition: background 0.12s; }
  tr.clickable:hover { background: rgba(0,229,255,0.06); }
  tr.clickable:hover td:first-child { color: var(--cyan); text-shadow: 0 0 8px rgba(0,229,255,0.5); }
  td.name { color: var(--text); }
  td.id { color: var(--amber); letter-spacing: 1px; }
  .type { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid; }
  .type.Channel { color: #7ad7ff; border-color: rgba(0,229,255,0.5); background: rgba(0,229,255,0.08); text-shadow: 0 0 6px rgba(0,229,255,0.5); }
  .type.MegaGroup { color: #9aa3ff; border-color: rgba(140,150,255,0.5); background: rgba(140,150,255,0.08); text-shadow: 0 0 6px rgba(140,150,255,0.5); }
  .type.Group { color: #6ff0c0; border-color: rgba(111,240,192,0.5); background: rgba(111,240,192,0.08); text-shadow: 0 0 6px rgba(111,240,192,0.5); }
  .type.Bot { color: #ff7ad9; border-color: rgba(255,45,149,0.5); background: rgba(255,45,149,0.08); text-shadow: 0 0 6px rgba(255,45,149,0.5); }
  .type.User { color: #ffc857; border-color: rgba(255,200,87,0.5); background: rgba(255,200,87,0.08); text-shadow: 0 0 6px rgba(255,200,87,0.5); }
  .fade { opacity: 0.35; }
  .empty { color: var(--text-dim); text-align: center; padding: 30px; font-size: 13px; letter-spacing: 2px; }
  footer { margin-top: 24px; text-align: center; color: var(--text-dim); font-size: 11px; letter-spacing: 2px; }
  footer .glow { color: var(--cyan); text-shadow: 0 0 6px rgba(0,229,255,0.6); }
  @media (max-width: 640px) {
    .title h1 { font-size: 20px; letter-spacing: 2px; }
    th, td { padding: 10px; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="scanlines"></div>

  <div class="app">
    <div class="langbar">
      <button class="langbtn" id="langEn">EN</button>
      <button class="langbtn" id="langZh">中文</button>
    </div>
    <header>
      <div class="title">
        <h1>Neural Downlink</h1>
        <span class="sub">// TG VIDEO DOWNLOADER</span>
      </div>
      <div class="statusline"><span class="led"></span><span id="statuslineText"></span></div>
    </header>

    <div class="panel">
      <div class="toolbar">
        <button id="refreshBtn">⟳ <span data-i18n="refresh"></span></button>
        <span id="status" class="status"></span>
      </div>

      <div id="taskStatus"></div>

      <details id="downloadPanel" hidden>
        <summary data-i18n="dlConfig"></summary>
        <div class="dlrow">
          <div id="selectedInfo" style="margin-bottom:10px; color:var(--cyan);"></div>
          <label data-i18n="maxSizeLabel"></label>
          <input id="maxSize" type="text" value="20GB" placeholder="3GB / 500MB / bytes">
          <button id="downloadBtn">▶ <span data-i18n="dlStart"></span></button>
          <button id="cancelBtn" class="danger">✕ <span data-i18n="cancel"></span></button>
        </div>
      </details>

      <details id="monitorPanel" hidden>
        <summary data-i18n="monitorTitle"></summary>
        <div class="dlrow">
          <div id="monitorInfo" style="margin-bottom:10px; color:var(--amber);"></div>
          <label data-i18n="intervalLabel"></label>
          <input id="monitorInterval" type="number" value="300" min="30" style="width:110px;">
          <button id="monitorStartBtn">◉ <span data-i18n="monitorStart"></span></button>
          <button id="monitorStopBtn" class="danger">■ <span data-i18n="monitorStop"></span></button>
        </div>
      </details>

      <table>
        <thead>
          <tr><th data-i18n="colName"></th><th>ID</th><th data-i18n="colType"></th><th data-i18n="colUnread"></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <footer>NEURAL DOWNLINK v2.0 &nbsp;//&nbsp; <span class="glow"><span data-i18n="uplink"></span>: <span id="countLabel">0</span></span></footer>
  </div>

<script>
const I18N = {
  en: {
    refresh: "Refresh",
    statuslineText: "UPLINK STABLE // SESSION DATA LINK",
    dlConfig: "Download Config",
    maxSizeLabel: "Max size (e.g. 3GB / 1.5MB / bytes):",
    dlStart: "Start Download",
    cancel: "Cancel",
    monitorTitle: "Auto Monitor · Download New",
    intervalLabel: "Poll interval (s):",
    monitorStart: "Start Monitor",
    monitorStop: "Stop Monitor",
    colName: "Name",
    colType: "Type",
    colUnread: "Unread",
    uplink: "UPLINK",
    loading: "Establishing data link...",
    loaded: (n) => `Link stable // ${n} chats. Click a row to select & download.`,
    linkDown: "Link down: ",
    selected: (name, id, type) => `◈ Selected: ${name}  [ID: ${id}]  [${type}]`,
    willMonitor: (name, id) => `Will auto-monitor: ${name}  [ID: ${id}]`,
    dlStarting: (name) => `Starting download for "${name}"...`,
    dlStartFail: "Download failed to start: ",
    monitorStartFail: "Monitor failed to start: ",
    monitorStopFail: "Monitor failed to stop: ",
    dlRunning: (chat) => `◉ Downloading (chat ${chat}): `,
    lastTask: (chat) => `◎ Last task (chat ${chat}): `,
    monitorActive: (chat, sec) => ` ● Auto-monitoring (chat ${chat} / every ${sec}s)`,
    monitorRunning: (chat, sec) => `● Auto-monitoring (chat ${chat} / every ${sec}s)`,
    done: "Done",
  },
  zh: {
    refresh: "刷新会话",
    statuslineText: "数据链路稳定 // 会话数据连接中",
    dlConfig: "下载配置",
    maxSizeLabel: "大小上限 (如 3GB / 1.5MB / 纯字节):",
    dlStart: "开始下载",
    cancel: "取消",
    monitorTitle: "自动监控 · 新增即下载",
    intervalLabel: "轮询间隔 (秒):",
    monitorStart: "启动监控",
    monitorStop: "停止监控",
    colName: "名称",
    colType: "类型",
    colUnread: "未读",
    uplink: "UPLINK",
    loading: "正在建立数据链路...",
    loaded: (n) => `数据链路正常 // 共 ${n} 个会话。点击一行选择并下载。`,
    linkDown: "链路中断: ",
    selected: (name, id, type) => `◈ 已选择: ${name}  [ID: ${id}]  [${type}]`,
    willMonitor: (name, id) => `将自动监控: ${name}  [ID: ${id}]`,
    dlStarting: (name) => `正在为「${name}」启动下载...`,
    dlStartFail: "下载启动失败: ",
    monitorStartFail: "监控启动失败: ",
    monitorStopFail: "监控停止失败: ",
    dlRunning: (chat) => `◉ 下载进行中 (会话 ${chat}): `,
    lastTask: (chat) => `◎ 上次任务 (会话 ${chat}): `,
    monitorActive: (chat, sec) => ` ● 自动监控中 (会话 ${chat} / 每 ${sec} 秒)`,
    monitorRunning: (chat, sec) => `● 自动监控中 (会话 ${chat} / 每 ${sec} 秒)`,
    done: "已完成",
  }
};

let lang = "en";
function detectLang() {
  const nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
  return nav.startsWith("zh") ? "zh" : "en";
}
function t(key, ...args) {
  const v = I18N[lang][key];
  return typeof v === "function" ? v(...args) : v;
}
function applyLang() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.getElementById("langEn").classList.toggle("active", lang === "en");
  document.getElementById("langZh").classList.toggle("active", lang === "zh");
  document.documentElement.lang = lang;
}
function setLang(l) {
  lang = l;
  applyLang();
  pollTaskStatus();
  if (selected) {
    document.getElementById("selectedInfo").textContent = t("selected", selected.name, selected.id, selected.type);
    document.getElementById("monitorInfo").textContent = t("willMonitor", selected.name, selected.id);
  }
}
document.getElementById("langEn").addEventListener("click", () => setLang("en"));
document.getElementById("langZh").addEventListener("click", () => setLang("zh"));

const rowsEl = document.getElementById("rows");
const statusEl = document.getElementById("status");
const refreshBtn = document.getElementById("refreshBtn");
const panel = document.getElementById("downloadPanel");
const countLabel = document.getElementById("countLabel");
let selected = null;

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = "status " + (type || "error");
}

async function load() {
  refreshBtn.disabled = true;
  rowsEl.innerHTML = "";
  setStatus(t("loading"), "ok");
  try {
    const res = await fetch("/api/dialogs");
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    rowsEl.innerHTML = "";
    for (const d of data.dialogs) {
      const tr = document.createElement("tr");
      tr.className = "clickable";
      const badge = `<span class="type ${d.type}">${d.type}</span>`;
      tr.innerHTML = `<td class="name">${escapeHtml(d.name)}</td><td class="id">${d.id}</td><td>${badge}</td><td>${d.unread}</td>`;
      tr.addEventListener("click", () => select(d, tr));
      rowsEl.appendChild(tr);
    }
    countLabel.textContent = data.dialogs.length;
    setStatus(t("loaded", data.dialogs.length), "ok");
  } catch (e) {
    setStatus(t("linkDown") + e.message);
  } finally {
    refreshBtn.disabled = false;
  }
}

function select(d, tr) {
  selected = d;
  [...rowsEl.children].forEach(r => r.classList.remove("fade"));
  tr.classList.add("fade");
  document.getElementById("selectedInfo").textContent = t("selected", d.name, d.id, d.type);
  document.getElementById("monitorInfo").textContent = t("willMonitor", d.name, d.id);
  panel.hidden = false;
  document.getElementById("monitorPanel").hidden = false;
}

async function doDownload() {
  if (!selected) return;
  document.getElementById("downloadBtn").disabled = true;
  setStatus(t("dlStarting", selected.name), "ok");
  try {
    const rawSize = document.getElementById("maxSize").value.trim();
    const body = { chat_id: selected.id };
    if (rawSize) body.max_total_size = rawSize;
    const res = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    setStatus(data.note, "ok");
  } catch (e) {
    setStatus(t("dlStartFail") + e.message);
  } finally {
    document.getElementById("downloadBtn").disabled = false;
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

refreshBtn.addEventListener("click", load);
document.getElementById("downloadBtn").addEventListener("click", doDownload);
document.getElementById("cancelBtn").addEventListener("click", () => {
  selected = null;
  panel.hidden = true;
  document.getElementById("monitorPanel").hidden = true;
  [...rowsEl.children].forEach(r => r.classList.remove("fade"));
});

async function startMonitor() {
  if (!selected) return;
  document.getElementById("monitorStartBtn").disabled = true;
  try {
    const interval = parseInt(document.getElementById("monitorInterval").value, 10) || 300;
    const res = await fetch("/api/monitor", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: selected.id, interval }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    setStatus(data.note, "ok");
  } catch (e) {
    setStatus(t("monitorStartFail") + e.message);
  } finally {
    document.getElementById("monitorStartBtn").disabled = false;
  }
}

async function stopMonitor() {
  try {
    const res = await fetch("/api/monitor", { method: "DELETE" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    setStatus(data.note, "ok");
  } catch (e) {
    setStatus(t("monitorStopFail") + e.message);
  }
}

document.getElementById("monitorStartBtn").addEventListener("click", startMonitor);
document.getElementById("monitorStopBtn").addEventListener("click", stopMonitor);

const taskEl = document.getElementById("taskStatus");
async function pollTaskStatus() {
  try {
    const res = await fetch("/api/status");
    const data = await res.json();
    const mon = data.monitor;
    const monText = (mon && mon.active)
      ? t("monitorActive", mon.chat_id, mon.interval)
      : "";
    if (data.running) {
      taskEl.style.display = "block";
      taskEl.textContent = t("dlRunning", data.chat_id) + (data.detail || "...") + monText;
    } else if (data.chat_id) {
      taskEl.style.display = "block";
      taskEl.textContent = t("lastTask", data.chat_id) + (data.detail || t("done")) + monText;
    } else if (mon && mon.active) {
      taskEl.style.display = "block";
      taskEl.textContent = t("monitorRunning", mon.chat_id, mon.interval);
    } else {
      taskEl.style.display = "none";
    }
  } catch (e) {
    // ignore transient polling errors
  }
}
setInterval(pollTaskStatus, 3000);

lang = detectLang();
applyLang();
load();
pollTaskStatus();
</script>
</body>
</html>
