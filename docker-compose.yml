# =====================================================================
# Telegram Video Downloader - Docker Compose
# =====================================================================
# Quick start:
#   1. cp .env.example .env        (fill in API_ID / API_HASH / CHANNEL_ID)
#   2. image 已指向本项目 GHCR 镜像（CI 自动推送，latest 保持最新）
#   3. docker compose up -d        (start downloading)
#   4. docker compose run --rm telegram-downloader list  (first-time login)
# =====================================================================

services:
  telegram-downloader:
    image: ghcr.io/hanlihanshaobo/tg-video-downloader-docker:latest
    container_name: telegram-video-downloader
    restart: unless-stopped

    # Telegram API credentials & settings are read from .env
    env_file:
      - .env

    # Persist the Telethon session and downloaded videos on the host
    volumes:
      - ./data:/app/data

    # Interactive terminal needed for the first-time login
    stdin_open: true
    tty: true

  telegram-downloader-web:
    image: ghcr.io/hanlihanshaobo/tg-video-downloader-docker:latest
    container_name: telegram-video-downloader-web
    restart: unless-stopped
    command: ["web"]

    env_file:
      - .env

    # Same persisted session and downloads as the main container
    volumes:
      - ./data:/app/data

    # Web backend on http://localhost:8080
    ports:
      - "8080:8080"
